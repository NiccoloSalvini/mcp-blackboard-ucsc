[project]
name = "mcp-blackboard-ucsc"
version = "0.1.0"
description = "MCP server for Blackboard Learn Ultra — course content, assessments, question pools and grading."
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.0.0",
    "httpx>=0.27",
]

[project.scripts]
mcp-blackboard = "bb_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bb_mcp"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
