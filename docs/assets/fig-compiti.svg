<svg xmlns="http://www.w3.org/2000/svg" width="900" height="255" viewBox="0 0 900 255" font-family="Libre Franklin, Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#193458"/>
    </marker>
  </defs>

  <!-- swimlane labels -->
  <text x="20" y="20" fill="#6b7480" font-size="12" font-weight="700">BLACKBOARD</text>
  <text x="20" y="150" fill="#6b7480" font-size="12" font-weight="700">COMPUTER DEL DOCENTE</text>
  <line x1="20" y1="130" x2="880" y2="130" stroke="#c9d1da" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- step 1 -->
  <rect x="20" y="160" width="160" height="80" rx="10" fill="#ffffff" stroke="#193458" stroke-width="1.5"/>
  <text x="100" y="185" text-anchor="middle" font-weight="700" fill="#193458">1. Crea il compito</text>
  <text x="100" y="205" text-anchor="middle" fill="#4a4a4a" font-size="12">istruzioni, punti, scadenza</text>
  <text x="100" y="222" text-anchor="middle" fill="#4a4a4a" font-size="12">nasce nascosto</text>

  <!-- step 2 on BB -->
  <rect x="20" y="30" width="160" height="80" rx="10" fill="#193458"/>
  <text x="100" y="58" text-anchor="middle" font-weight="700" fill="#ffffff">2. Gli studenti</text>
  <text x="100" y="78" text-anchor="middle" fill="#dfe7f0" font-size="12">consegnano su Blackboard</text>
  <text x="100" y="95" text-anchor="middle" fill="#dfe7f0" font-size="12">come sempre</text>
  <line x1="100" y1="158" x2="100" y2="112" stroke="#193458" stroke-width="2" marker-end="url(#arr)"/>

  <!-- step 3 -->
  <rect x="220" y="160" width="160" height="80" rx="10" fill="#ffffff" stroke="#193458" stroke-width="1.5"/>
  <text x="300" y="185" text-anchor="middle" font-weight="700" fill="#193458">3. Coda consegne</text>
  <text x="300" y="205" text-anchor="middle" fill="#4a4a4a" font-size="12">chi, quando, con nome</text>
  <text x="300" y="222" text-anchor="middle" fill="#4a4a4a" font-size="12">e matricola</text>
  <line x1="182" y1="70" x2="300" y2="70" stroke="#193458" stroke-width="2"/>
  <line x1="300" y1="70" x2="300" y2="158" stroke="#193458" stroke-width="2" marker-end="url(#arr)"/>

  <!-- step 4 -->
  <rect x="420" y="160" width="160" height="80" rx="10" fill="#eef3f8" stroke="#0862a8" stroke-width="1.5"/>
  <text x="500" y="185" text-anchor="middle" font-weight="700" fill="#0862a8">4. Correzione locale</text>
  <text x="500" y="205" text-anchor="middle" fill="#4a4a4a" font-size="12">file scaricati, letti ed</text>
  <text x="500" y="222" text-anchor="middle" fill="#4a4a4a" font-size="12">eseguiti sul mio computer</text>
  <line x1="382" y1="200" x2="418" y2="200" stroke="#193458" stroke-width="2" marker-end="url(#arr)"/>

  <!-- step 5 -->
  <rect x="620" y="160" width="180" height="80" rx="10" fill="#ffffff" stroke="#193458" stroke-width="1.5"/>
  <text x="710" y="185" text-anchor="middle" font-weight="700" fill="#193458">5. Voto e feedback</text>
  <text x="710" y="205" text-anchor="middle" fill="#4a4a4a" font-size="12">proposti dal modello,</text>
  <text x="710" y="222" text-anchor="middle" fill="#4a4a4a" font-size="12">rivisti e confermati da me</text>
  <line x1="582" y1="200" x2="618" y2="200" stroke="#193458" stroke-width="2" marker-end="url(#arr)"/>

  <!-- step 6 on BB -->
  <rect x="620" y="30" width="180" height="80" rx="10" fill="#193458"/>
  <text x="710" y="58" text-anchor="middle" font-weight="700" fill="#ffffff">6. Registro</text>
  <text x="710" y="78" text-anchor="middle" fill="#dfe7f0" font-size="12">il voto arriva allo studente</text>
  <text x="710" y="95" text-anchor="middle" fill="#dfe7f0" font-size="12">solo quando lo pubblico</text>
  <line x1="710" y1="158" x2="710" y2="112" stroke="#193458" stroke-width="2" marker-end="url(#arr)"/>

</svg>
