<svg xmlns="http://www.w3.org/2000/svg" width="900" height="415" viewBox="0 0 900 415" font-family="Libre Franklin, Helvetica, Arial, sans-serif" font-size="15">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#193458"/>
    </marker>
  </defs>

  <!-- docente -->
  <rect x="20" y="40" width="170" height="70" rx="10" fill="#ffffff" stroke="#193458" stroke-width="1.5"/>
  <text x="105" y="70" text-anchor="middle" font-weight="700" fill="#193458">Docente</text>
  <text x="105" y="92" text-anchor="middle" fill="#4a4a4a" font-size="13">«pubblica un annuncio…»</text>

  <!-- modello -->
  <rect x="20" y="150" width="170" height="90" rx="10" fill="#ffffff" stroke="#193458" stroke-width="1.5"/>
  <text x="105" y="180" text-anchor="middle" font-weight="700" fill="#193458">Modello linguistico</text>
  <text x="105" y="202" text-anchor="middle" fill="#4a4a4a" font-size="13">legge la richiesta e la</text>
  <text x="105" y="219" text-anchor="middle" fill="#4a4a4a" font-size="13">descrizione degli strumenti</text>
  <line x1="105" y1="112" x2="105" y2="148" stroke="#193458" stroke-width="2" marker-end="url(#arr)"/>

  <!-- harness -->
  <rect x="240" y="40" width="400" height="360" rx="14" fill="#eef3f8" stroke="#193458" stroke-width="2"/>
  <text x="440" y="70" text-anchor="middle" font-size="17" font-weight="700" fill="#193458">Harness (l'«imbracatura»)</text>
  <text x="440" y="92" text-anchor="middle" fill="#4a4a4a" font-size="13">programma che fa lavorare il modello dentro regole fisse</text>

  <rect x="265" y="115" width="350" height="52" rx="8" fill="#ffffff" stroke="#0862a8" stroke-width="1.5"/>
  <text x="280" y="137" font-weight="700" fill="#0862a8" font-size="14">1. Decide cosa il modello può toccare</text>
  <text x="280" y="156" fill="#4a4a4a" font-size="13">solo gli strumenti dichiarati, con i permessi accesi in quel momento</text>

  <rect x="265" y="180" width="350" height="52" rx="8" fill="#ffffff" stroke="#0862a8" stroke-width="1.5"/>
  <text x="280" y="202" font-weight="700" fill="#0862a8" font-size="14">2. Mostra il passo prima di eseguirlo</text>
  <text x="280" y="221" fill="#4a4a4a" font-size="13">ogni scrittura su Blackboard passa da una conferma del docente</text>

  <rect x="265" y="245" width="350" height="52" rx="8" fill="#ffffff" stroke="#0862a8" stroke-width="1.5"/>
  <text x="280" y="267" font-weight="700" fill="#0862a8" font-size="14">3. Esegue e riporta il risultato</text>
  <text x="280" y="286" fill="#4a4a4a" font-size="13">il modello vede la risposta dell'API, non decide da solo il passo dopo</text>

  <rect x="265" y="310" width="350" height="52" rx="8" fill="#ffffff" stroke="#0862a8" stroke-width="1.5"/>
  <text x="280" y="332" font-weight="700" fill="#0862a8" font-size="14">4. Registra tutto</text>
  <text x="280" y="351" fill="#4a4a4a" font-size="13">ogni chiamata e ogni risposta restano in un log locale, rileggibile</text>

  <line x1="192" y1="195" x2="238" y2="195" stroke="#193458" stroke-width="2" marker-end="url(#arr)" marker-start="url(#arr)"/>

  <!-- server -->
  <rect x="690" y="150" width="190" height="90" rx="10" fill="#ffffff" stroke="#193458" stroke-width="1.5"/>
  <text x="785" y="180" text-anchor="middle" font-weight="700" fill="#193458">Server MCP</text>
  <text x="785" y="202" text-anchor="middle" fill="#4a4a4a" font-size="13">traduce lo strumento in</text>
  <text x="785" y="219" text-anchor="middle" fill="#4a4a4a" font-size="13">una chiamata all'API</text>
  <line x1="642" y1="195" x2="688" y2="195" stroke="#193458" stroke-width="2" marker-end="url(#arr)" marker-start="url(#arr)"/>

  <rect x="690" y="290" width="190" height="70" rx="10" fill="#193458"/>
  <text x="785" y="320" text-anchor="middle" font-weight="700" fill="#ffffff">Blackboard</text>
  <text x="785" y="342" text-anchor="middle" fill="#dfe7f0" font-size="13">API REST ufficiale</text>
  <line x1="785" y1="242" x2="785" y2="288" stroke="#193458" stroke-width="2" marker-end="url(#arr)" marker-start="url(#arr)"/>

</svg>
